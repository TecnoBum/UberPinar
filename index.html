<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#10b981">
    <title>UberPinar | Transporte</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --secondary: #000000;
            --bg: #f0fdf4;
            --white: #ffffff;
            --gray-100: #f0fdf4;
            --gray-200: #bbf7d0;
            --gray-500: #6b7280;
            --gray-700: #374151;
            --danger: #ef4444;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
        
        body { background: var(--bg); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

        header { 
            background: var(--white); 
            padding: 0.8rem 1rem; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid var(--gray-200); 
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .logo { display: flex; align-items: center; gap: 10px; }
        
        .logo-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.3rem;
        }
        
        .logo-text { font-weight: 800; font-size: 1.3rem; color: var(--gray-900); }
        .logo-text span { color: var(--primary); }
        
        .btn-icon { 
            background: var(--gray-100); 
            border: none; 
            font-size: 1.1rem; 
            color: var(--gray-700); 
            cursor: pointer; 
            padding: 10px; 
            border-radius: 12px;
            min-width: 40px;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-icon:hover { background: var(--gray-200); }

        .status-badge {
            font-size: 0.65rem;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
            background: var(--gray-200);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .status-badge.online { background: #dcfce7; color: #166534; }
        .status-badge.sync { background: #fef3c7; color: #92400e; animation: pulse 2s infinite; }
        .status-badge.error { background: #fee2e2; color: #991b1b; }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

        .view { display: none; flex: 1; flex-direction: column; min-height: calc(100vh - 65px); }
        .view.active { display: flex; }

        .passenger-container { display: flex; flex-direction: column; flex: 1; padding: 1rem; gap: 1rem; }
        
        .welcome-card {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: 20px;
            padding: 1.5rem;
            color: white;
            text-align: center;
        }
        .welcome-card h2 { font-size: 1.3rem; margin-bottom: 0.5rem; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .welcome-card p { font-size: 0.9rem; opacity: 0.95; }

        .input-group {
            background: var(--white);
            border-radius: 16px;
            padding: 1rem;
            box-shadow: var(--shadow);
        }
        
        .input-field {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--gray-200);
            border-radius: 12px;
            font-size: 0.9rem;
            margin-bottom: 10px;
            outline: none;
        }
        .input-field:focus { border-color: var(--primary); }

        .btn-primary {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 1rem;
            background: var(--secondary);
            color: white;
            transition: all 0.2s;
        }
        .btn-primary:active { transform: scale(0.98); }
        
        .btn-secondary { background: var(--white); color: var(--secondary); border: 2px solid var(--gray-200); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-success { background: var(--primary); color: white; }

        .status-card {
            background: var(--white);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
            display: none;
            box-shadow: var(--shadow);
        }
        .status-card.active { display: block; }
        .status-icon { font-size: 3rem; margin-bottom: 0.5rem; color: var(--primary); }
        .status-text { font-weight: 600; color: var(--gray-700); margin-bottom: 1rem; }

        .chat-container { display: flex; flex-direction: column; height: 100%; background: var(--bg); }
        
        .chat-header {
            background: var(--white);
            padding: 1rem;
            border-bottom: 2px solid var(--gray-200);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .chat-avatar {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.3rem;
        }
        
        .chat-info { flex: 1; }
        .chat-name { font-weight: 700; font-size: 1rem; }
        .chat-status { font-size: 0.75rem; color: var(--primary); display: flex; align-items: center; gap: 4px; }
        .chat-status::before { content: ''; width: 6px; height: 6px; background: var(--primary); border-radius: 50%; }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.9rem;
            animation: slideIn 0.3s ease;
            word-wrap: break-word;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.sent { align-self: flex-end; background: var(--primary); color: white; border-bottom-right-radius: 4px; }
        .message.received { align-self: flex-start; background: var(--white); box-shadow: var(--shadow); border-bottom-left-radius: 4px; }
        .message-time { font-size: 0.7rem; opacity: 0.7; margin-top: 4px; text-align: right; display: block; }

        .chat-input-container {
            background: var(--white);
            padding: 1rem;
            border-top: 2px solid var(--gray-200);
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .chat-input {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid var(--gray-200);
            border-radius: 25px;
            font-size: 0.95rem;
            outline: none;
        }
        .chat-input:focus { border-color: var(--primary); }
        
        .chat-send {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: var(--primary);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .chat-send:hover { background: var(--primary-dark); }
        .chat-send:active { transform: scale(0.95); }

        .requests-list { padding: 1rem; overflow-y: auto; flex: 1; }
        
        .request-card {
            background: var(--white);
            border-radius: 16px;
            padding: 1rem;
            margin-bottom: 1rem;
            border-left: 4px solid var(--primary);
            box-shadow: var(--shadow);
        }
        
        .request-header { display: flex; justify-content: space-between; margin-bottom: 0.8rem; align-items: center; }
        .request-title { font-weight: 700; display: flex; align-items: center; gap: 6px; }
        .request-info { font-size: 0.85rem; color: var(--gray-700); margin-bottom: 0.5rem; display: flex; align-items: center; gap: 6px; }
        
        .btn-small {
            flex: 1;
            padding: 0.6rem;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .modal-overlay.active { display: flex; }
        
        .modal-container {
            background: var(--white);
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            overflow: hidden;
        }
        
        .modal-header {
            padding: 1.2rem;
            border-bottom: 2px solid var(--gray-200);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-title { font-size: 1.2rem; font-weight: 700; }
        .modal-close { background: none; border: none; font-size: 1.3rem; color: var(--gray-500); cursor: pointer; }
        .modal-body { padding: 1.2rem; }
        .modal-footer {
            padding: 1rem 1.2rem;
            border-top: 2px solid var(--gray-200);
            display: flex;
            gap: 10px;
        }
        .modal-footer .btn-primary { flex: 1; margin-top: 0; }

        .hidden { display: none !important; }
        .text-center { text-align: center; }
        .mb-2 { margin-bottom: 1rem; }
        .flex-center { display: flex; align-items: center; gap: 6px; }

        .loading {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 3000;
        }
        .loading-spinner {
            width: 50px; height: 50px;
            border: 4px solid var(--gray-200);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 1rem;
            border-radius: 12px;
            margin: 1rem;
            font-size: 0.9rem;
            display: none;
        }
        .error-message.show { display: block; }

        @media (max-width: 480px) {
            .logo-text { font-size: 1.1rem; }
            .message { max-width: 85%; }
            .btn-primary { padding: 0.9rem; font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <div id="loadingScreen" class="loading">
        <div class="loading-spinner"></div>
        <p style="margin-top: 1rem; color: var(--gray-700); font-weight: 600;">Conectando...</p>
    </div>

    <header>
        <div class="logo">
            <div class="logo-icon">
                <i class="fa-solid fa-leaf"></i>
                <i class="fa-solid fa-shuttle-van" style="position: relative; z-index: 1; font-size: 1.1rem;"></i>
            </div>
            <div class="logo-text">Uber<span>Pinar</span></div>
        </div>
        <div style="display:flex;gap:10px;align-items:center;">
            <span id="syncStatus" class="status-badge sync">
                <i class="fa-solid fa-sync fa-spin"></i> Sync
            </span>
            <button class="btn-icon" onclick="openRoleModal()">
                <i class="fa-solid fa-user"></i>
            </button>
        </div>
    </header>

    <div id="errorMessage" class="error-message">
        <i class="fa-solid fa-triangle-exclamation"></i> <span id="errorText"></span>
    </div>

    <!-- Vista Pasajero -->
    <div id="viewPassenger" class="view">
        <div class="passenger-container">
            <div class="welcome-card">
                <h2><i class="fa-solid fa-leaf"></i> Transporte Ecológico</h2>
                <p>Viaja de forma sostenible</p>
            </div>
            
            <div class="input-group">
                <input type="text" class="input-field" id="pickupLocation" placeholder="<i class='fa-solid fa-location-dot'></i> Punto de recogida (opcional)">
                <input type="text" class="input-field" id="dropoffLocation" placeholder="<i class='fa-solid fa-flag-checkered'></i> Destino (opcional)">
            </div>

            <div id="statusCard" class="status-card">
                <div class="status-icon" id="statusIcon"><i class="fa-regular fa-hourglass"></i></div>
                <div class="status-text" id="statusText">Esperando confirmación...</div>
                <button class="btn-primary btn-danger" onclick="cancelRide()">
                    <i class="fa-solid fa-xmark"></i> Cancelar
                </button>
            </div>

            <button id="btnRequest" class="btn-primary" onclick="requestRide()">
                <i class="fa-solid fa-bolt"></i> Solicitar Viaje
            </button>
            
            <button id="btnChat" class="btn-primary btn-secondary hidden" onclick="openChat()">
                <i class="fa-regular fa-comment-dots"></i> Abrir Chat
            </button>
        </div>
    </div>

    <!-- Vista Chat -->
    <div id="viewChat" class="view">
        <div class="chat-container">
            <div class="chat-header">
                <button class="btn-icon" onclick="goBack()">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <div class="chat-avatar"><i class="fa-solid fa-user-tie"></i></div>
                <div class="chat-info">
                    <div class="chat-name">Admin UberPinar</div>
                    <div class="chat-status">En línea</div>
                </div>
            </div>
            
            <div class="chat-messages" id="chatMessages"></div>
            
            <div class="chat-input-container">
                <input type="text" class="chat-input" id="chatInput" placeholder="Escribe un mensaje..." onkeypress="handleChatEnter(event)">
                <button class="chat-send" onclick="sendChatMessage()">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Vista Admin -->
    <div id="viewAdmin" class="view">
        <div class="requests-list" id="adminRequests">
            <p class="text-center" style="color: var(--gray-500); padding: 2rem;">Cargando solicitudes...</p>
        </div>
    </div>

    <!-- Modal Rol -->
    <div id="roleModal" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <span class="modal-title">Selecciona tu Perfil</span>
                <button class="modal-close" onclick="closeModal('roleModal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <button class="btn-primary mb-2" onclick="selectRole('passenger')">
                    <i class="fa-solid fa-person-walking"></i> Soy Pasajero
                </button>
                <button class="btn-primary btn-secondary" onclick="openAdminLogin()">
                    <i class="fa-solid fa-shield-halved"></i> Soy Admin
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Admin -->
    <div id="adminLoginModal" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <span class="modal-title">Acceso Admin</span>
                <button class="modal-close" onclick="closeModal('adminLoginModal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <input type="password" id="adminCode" class="input-field" placeholder="Código de seguridad">
            </div>
            <div class="modal-footer">
                <button class="btn-primary btn-secondary" onclick="closeModal('adminLoginModal')">Cancelar</button>
                <button class="btn-primary" onclick="verifyAdmin()">Entrar</button>
            </div>
        </div>
    </div>

    <script>
        // ==================== CONFIGURACIÓN ====================
        const GIST_ID = '9a911f3413bcc8cedee3dfa5ed6d1809';
        const ADMIN_CODE = 'ADMIN2024';
        const GIST_FILENAME = 'uberpinar-data.json';
        
        // Token opcional para escritura (dejar vacío para modo solo lectura)
        const GITHUB_TOKEN = ''; 
        
        let currentRole = null;
        let currentRequestId = null;
        let currentChatId = null;
        let gistData = { requests: [], chats: {} };
        let lastSync = 0;
        let syncInterval = null;
        let isWriting = false;
        let writeQueue = [];

        // ==================== INICIALIZACIÓN ====================
        window.onload = async function() {
            try {
                await initializeApp();
            } catch (error) {
                showError('Error de conexión: ' + error.message);
                // Continuar con modo offline
                gistData = loadLocalData();
                document.getElementById('loadingScreen').style.display = 'none';
                openRoleModal();
            }
        };

        async function initializeApp() {
            await loadGistData();
            document.getElementById('loadingScreen').style.display = 'none';
            openRoleModal();
            
            // Iniciar sincronización
            startSync();
        }

        function startSync() {
            if (syncInterval) clearInterval(syncInterval);
            syncInterval = setInterval(syncData, 3000);
        }

        function stopSync() {
            if (syncInterval) {
                clearInterval(syncInterval);
                syncInterval = null;
            }
        }

        // ==================== GESTIÓN DE DATOS ====================
        function loadLocalData() {
            try {
                const saved = localStorage.getItem('uberpinar_local');
                return saved ? JSON.parse(saved) : { requests: [], chats: {} };
            } catch {
                return { requests: [], chats: {} };
            }
        }

        function saveLocalData() {
            try {
                localStorage.setItem('uberpinar_local', JSON.stringify(gistData));
            } catch (e) {
                console.warn('No se pudo guardar localmente:', e);
            }
        }

        async function loadGistData() {
            const url = `https://api.github.com/gists/${GIST_ID}`;
            const headers = { 'Accept': 'application/vnd.github.v3+json' };
            
            if (GITHUB_TOKEN) {
                headers['Authorization'] = `token ${GITHUB_TOKEN}`;
            }
            
            const response = await fetch(url, { headers, cache: 'no-store' });
            
            if (!response.ok) {
                if (response.status === 404) {
                    throw new Error('Gist no encontrado. Verifica el ID.');
                }
                throw new Error('Error al cargar datos: ' + response.status);
            }
            
            const gist = await response.json();
            const file = gist.files[GIST_FILENAME];
            
            if (file && file.content) {
                gistData = JSON.parse(file.content);
                saveLocalData();
            }
            
            updateSyncStatus(true);
        }

        async function saveGistData() {
            if (isWriting) {
                writeQueue.push(() => saveGistData());
                return;
            }
            
            isWriting = true;
            
            try {
                if (!GITHUB_TOKEN) {
                    // Sin token: solo guardar localmente
                    saveLocalData();
                    updateSyncStatus(true);
                    return;
                }
                
                const url = `https://api.github.com/gists/${GIST_ID}`;
                const response = await fetch(url, {
                    method: 'PATCH',
                    headers: {
                        'Accept': 'application/vnd.github.v3+json',
                        'Authorization': `token ${GITHUB_TOKEN}`
                    },
                    body: JSON.stringify({
                        files: {
                            [GIST_FILENAME]: {
                                content: JSON.stringify(gistData, null, 2)
                            }
                        }
                    })
                });
                
                if (!response.ok) {
                    throw new Error('Error al guardar: ' + response.status);
                }
                
                saveLocalData();
                updateSyncStatus(true);
                
            } catch (error) {
                console.error('Error guardando:', error);
                saveLocalData(); // Fallback a local
                updateSyncStatus(false);
                showError('Modo offline: cambios guardados localmente');
                
            } finally {
                isWriting = false;
                // Procesar cola de escrituras
                if (writeQueue.length > 0) {
                    const next = writeQueue.shift();
                    next();
                }
            }
        }

        async function syncData() {
            try {
                const url = `https://api.github.com/gists/${GIST_ID}?t=${Date.now()}`;
                const headers = { 'Accept': 'application/vnd.github.v3+json' };
                
                if (GITHUB_TOKEN) {
                    headers['Authorization'] = `token ${GITHUB_TOKEN}`;
                }
                
                const response = await fetch(url, { headers, cache: 'no-store' });
                
                if (!response.ok) {
                    updateSyncStatus(false);
                    return;
                }
                
                const gist = await response.json();
                const file = gist.files[GIST_FILENAME];
                
                if (file && file.content) {
                    const newData = JSON.parse(file.content);
                    
                    // Detectar cambios y actualizar UI
                    if (hasDataChanged(newData)) {
                        gistData = newData;
                        saveLocalData();
                        updateUI();
                    }
                }
                
                updateSyncStatus(true);
                
            } catch (error) {
                console.error('Sync error:', error);
                updateSyncStatus(false);
            }
        }

        function hasDataChanged(newData) {
            return JSON.stringify(newData) !== JSON.stringify(gistData);
        }

        function updateUI() {
            if (currentRole === 'admin') {
                renderAdminRequests();
            } else if (currentRole === 'passenger' && currentChatId) {
                loadChat();
                // Verificar estado del viaje
                checkRideStatus();
            }
        }

        function checkRideStatus() {
            if (!currentRequestId) return;
            const req = gistData.requests.find(r => r.id === currentRequestId);
            if (req) {
                if (req.status === 'accepted' && !document.getElementById('btnChat').classList.contains('hidden')) {
                    // Ya está aceptado
                } else if (req.status === 'accepted') {
                    onAccepted();
                } else if (req.status === 'cancelled' || req.status === 'rejected') {
                    resetUI();
                    showNotification('Viaje cancelado', 'El admin ha cancelado tu solicitud');
                }
            }
        }

        function updateSyncStatus(online) {
            const statusEl = document.getElementById('syncStatus');
            if (online) {
                statusEl.innerHTML = '<i class="fa-solid fa-check"></i> Online';
                statusEl.className = 'status-badge online';
            } else {
                statusEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Offline';
                statusEl.className = 'status-badge error';
            }
        }

        function showError(message) {
            document.getElementById('errorText').textContent = message;
            document.getElementById('errorMessage').classList.add('show');
            setTimeout(() => {
                document.getElementById('errorMessage').classList.remove('show');
            }, 5000);
        }

        // ==================== ROLES ====================
        function openRoleModal() {
            document.getElementById('roleModal').classList.add('active');
        }

        function selectRole(role) {
            currentRole = role;
            closeModal('roleModal');
            
            // Ocultar todas las vistas
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            
            // Mostrar vista correspondiente
            if (role === 'passenger') {
                document.getElementById('viewPassenger').classList.add('active');
            } else {
                document.getElementById('viewAdmin').classList.add('active');
                renderAdminRequests();
            }
            
            showNotification('Bienvenido', `Modo: ${role === 'passenger' ? 'Pasajero' : 'Administrador'}`);
        }

        function openAdminLogin() {
            closeModal('roleModal');
            document.getElementById('adminLoginModal').classList.add('active');
        }

        function verifyAdmin() {
            const code = document.getElementById('adminCode').value;
            if (code === ADMIN_CODE) {
                closeModal('adminLoginModal');
                selectRole('admin');
            } else {
                showNotification('Error', 'Código incorrecto');
            }
        }

        // ==================== PASAJERO ====================
        async function requestRide() {
            const pickup = document.getElementById('pickupLocation').value.trim() || 'No especificado';
            const dropoff = document.getElementById('dropoffLocation').value.trim() || 'No especificado';
            
            currentRequestId = 'ride_' + Date.now();
            currentChatId = currentRequestId;
            
            const request = {
                id: currentRequestId,
                pickup,
                dropoff,
                time: new Date().toLocaleString(),
                status: 'pending',
                passengerId: 'pass_' + Math.random().toString(36).substr(2, 6)
            };
            
            gistData.requests.push(request);
            
            if (!gistData.chats[currentRequestId]) {
                gistData.chats[currentRequestId] = [];
            }
            
            await saveGistData();
            
            // Actualizar UI
            document.getElementById('statusCard').classList.add('active');
            document.getElementById('btnRequest').classList.add('hidden');
            document.getElementById('statusIcon').innerHTML = '<i class="fa-regular fa-hourglass"></i>';
            document.getElementById('statusText').textContent = 'Esperando confirmación...';
            
            // Abrir chat automáticamente
            setTimeout(() => {
                openChat();
                addMessage(`Solicité un viaje. Recogida: ${pickup}. Destino: ${dropoff}`, 'sent');
            }, 1500);
            
            showNotification('Solicitud enviada', 'El admin recibirá tu solicitud');
        }

        async function cancelRide() {
            if (!currentRequestId) return;
            
            const req = gistData.requests.find(r => r.id === currentRequestId);
            if (req) {
                req.status = 'cancelled';
                await saveGistData();
            }
            
            resetUI();
            showNotification('Cancelado', 'Viaje cancelado correctamente');
        }

        function onAccepted() {
            document.getElementById('statusIcon').innerHTML = '<i class="fa-solid fa-circle-check"></i>';
            document.getElementById('statusText').textContent = '¡Viaje Confirmado!';
            document.getElementById('btnChat').classList.remove('hidden');
            showNotification('¡Aceptado!', 'El admin confirmó tu viaje');
        }

        function resetUI() {
            currentRequestId = null;
            currentChatId = null;
            document.getElementById('statusCard').classList.remove('active');
            document.getElementById('btnRequest').classList.remove('hidden');
            document.getElementById('btnChat').classList.add('hidden');
            document.getElementById('pickupLocation').value = '';
            document.getElementById('dropoffLocation').value = '';
        }

        // ==================== ADMIN ====================
        function renderAdminRequests() {
            const container = document.getElementById('adminRequests');
            const pending = gistData.requests.filter(r => r.status === 'pending');
            
            if (pending.length === 0) {
                container.innerHTML = '<p class="text-center" style="color: var(--gray-500); padding: 2rem;">No hay solicitudes pendientes</p>';
                return;
            }
            
            container.innerHTML = '';
            
            pending.forEach(req => {
                const card = document.createElement('div');
                card.className = 'request-card';
                card.innerHTML = `
                    <div class="request-header">
                        <div class="request-title">
                            <i class="fa-solid fa-taxi"></i> Nuevo Viaje
                        </div>
                        <div style="font-size:0.75rem;color:var(--gray-500)">${req.time}</div>
                    </div>
                    <div class="request-info">
                        <i class="fa-solid fa-location-dot"></i> ${req.pickup}
                    </div>
                    <div class="request-info">
                        <i class="fa-solid fa-flag-checkered"></i> ${req.dropoff}
                    </div>
                    <div style="display:flex;gap:8px;margin-top:0.5rem;">
                        <button class="btn-small btn-success" onclick="acceptRequest('${req.id}')">
                            <i class="fa-solid fa-check"></i> Aceptar
                        </button>
                        <button class="btn-small btn-danger" onclick="rejectRequest('${req.id}')">
                            <i class="fa-solid fa-xmark"></i> Rechazar
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function acceptRequest(id) {
            const req = gistData.requests.find(r => r.id === id);
            if (!req) return;
            
            req.status = 'accepted';
            currentChatId = id;
            
            await saveGistData();
            
            // Abrir chat y enviar mensaje de bienvenida
            openChat();
            addMessage('Hola, soy el admin. Tu viaje ha sido confirmado. ¿En qué más puedo ayudarte?', 'received');
            
            renderAdminRequests();
            showNotification('Viaje aceptado', 'Chat abierto con el pasajero');
        }

        async function rejectRequest(id) {
            const req = gistData.requests.find(r => r.id === id);
            if (!req) return;
            
            req.status = 'rejected';
            await saveGistData();
            
            renderAdminRequests();
            showNotification('Rechazado', 'Solicitud rechazada');
        }

        // ==================== CHAT ====================
        function openChat() {
            if (!currentChatId && currentRole === 'passenger') {
                // Buscar último chat activo
                const lastRequest = gistData.requests.slice().reverse().find(r => r.passengerId);
                if (lastRequest) {
                    currentChatId = lastRequest.id;
                } else {
                    currentChatId = 'general';
                    if (!gistData.chats[currentChatId]) {
                        gistData.chats[currentChatId] = [];
                    }
                }
            }
            
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('viewChat').classList.add('active');
            
            loadChat();
        }

        function goBack() {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            
            if (currentRole === 'passenger') {
                document.getElementById('viewPassenger').classList.add('active');
            } else {
                document.getElementById('viewAdmin').classList.add('active');
                renderAdminRequests();
            }
        }

        function handleChatEnter(event) {
            if (event.key === 'Enter') {
                sendChatMessage();
            }
        }

        async function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            
            if (!text || !currentChatId) return;
            
            // Asegurar que existe el array de chats
            if (!gistData.chats[currentChatId]) {
                gistData.chats[currentChatId] = [];
            }
            
            const message = {
                id: 'msg_' + Date.now(),
                text: text,
                from: currentRole,
                timestamp: Date.now(),
                time: new Date().toLocaleTimeString()
            };
            
            gistData.chats[currentChatId].push(message);
            
            await saveGistData();
            
            // Mostrar mensaje inmediatamente
            addMessage(text, 'sent');
            input.value = '';
        }

        function addMessage(text, type) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.innerHTML = `
                ${text}
                <span class="message-time">${new Date().toLocaleTimeString()}</span>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function loadChat() {
            if (!currentChatId) return;
            
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';
            
            const messages = gistData.chats[currentChatId] || [];
            
            messages.forEach(msg => {
                const type = msg.from === currentRole ? 'sent' : 'received';
                addMessage(msg.text, type);
            });
        }

        // ==================== NOTIFICACIONES ====================
        function showNotification(title, message) {
            // Crear notificación temporal
            const notif = document.createElement('div');
            notif.style.cssText = `
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                background: var(--gray-900);
                color: white;
                padding: 12px 20px;
                border-radius: 12px;
                font-size: 0.9rem;
                z-index: 3000;
                box-shadow: var(--shadow-lg);
                animation: slideUp 0.3s ease;
            `;
            notif.innerHTML = `<strong>${title}</strong><br>${message}`;
            document.body.appendChild(notif);
            
            setTimeout(() => {
                notif.style.opacity = '0';
                notif.style.transition = 'opacity 0.3s';
                setTimeout(() => notif.remove(), 300);
            }, 3000);
        }

        // ==================== MODALES ====================
        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        // Cerrar modales al hacer click fuera
        document.querySelectorAll('.modal-overlay').forEach(modal => {
            modal.addEventListener('click', function(event) {
                if (event.target === this) {
                    closeModal(this.id);
                }
            });
        });

        // Limpiar datos antiguos periódicamente
        setInterval(() => {
            // Mantener solo últimas 100 solicitudes
            if (gistData.requests.length > 100) {
                gistData.requests = gistData.requests.slice(-100);
            }
            
            // Limpiar chats muy antiguos (más de 24h)
            const oneDayAgo = Date.now() - (24 * 60 * 60 * 1000);
            Object.keys(gistData.chats).forEach(chatId => {
                gistData.chats[chatId] = gistData.chats[chatId].filter(
                    m => m.timestamp > oneDayAgo
                );
            });
            
            saveLocalData();
        }, 60000);

        // Manejar visibilidad de página para re-sincronizar
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden && currentRole) {
                syncData();
            }
        });
    </script>
</body>
</html>
