<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#10b981">
    <title>UberPinar | Transporte</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --secondary: #000000;
            --bg: #f0fdf4;
            --white: #ffffff;
            --gray-100: #f0fdf4;
            --gray-200: #bbf7d0;
            --gray-500: #6b7280;
            --gray-700: #374151;
            --gray-900: #111827;
            --danger: #ef4444;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
        
        body { background: var(--bg); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

        /* HEADER */
        header { 
            background: var(--white); 
            padding: 0.8rem 1rem; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid var(--gray-200); 
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .logo { display: flex; align-items: center; gap: 10px; }
        
        .logo-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .logo-icon::before { content: '🍃'; font-size: 1.8rem; position: absolute; top: -2px; }
        .logo-icon::after { content: '🛺'; font-size: 1.4rem; position: relative; z-index: 1; }
        
        .logo-text { font-weight: 800; font-size: 1.3rem; color: var(--gray-900); }
        .logo-text span { color: var(--primary); }
        
        .btn-icon { 
            background: var(--gray-100); 
            border: none; 
            font-size: 1.1rem; 
            color: var(--gray-700); 
            cursor: pointer; 
            padding: 10px; 
            border-radius: 12px;
            min-width: 40px;
            min-height: 40px;
        }

        /* VISTAS */
        .view { display: none; flex: 1; flex-direction: column; min-height: calc(100vh - 65px); }
        .view.active { display: flex; }

        /* PASAJERO */
        .passenger-container { 
            display: flex; 
            flex-direction: column; 
            flex: 1;
            padding: 1rem;
            gap: 1rem;
        }
        
        .welcome-card {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: 20px;
            padding: 1.5rem;
            color: white;
            text-align: center;
        }
        
        .welcome-card h2 { font-size: 1.3rem; margin-bottom: 0.5rem; }
        .welcome-card p { font-size: 0.9rem; opacity: 0.95; }

        .input-group {
            background: var(--white);
            border-radius: 16px;
            padding: 1rem;
            box-shadow: var(--shadow);
        }
        
        .input-field {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--gray-200);
            border-radius: 12px;
            font-size: 0.9rem;
            margin-bottom: 10px;
            outline: none;
        }
        .input-field:focus { border-color: var(--primary); }

        .btn-primary {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 1rem;
            background: var(--secondary);
            color: white;
        }
        
        .btn-secondary { background: var(--white); color: var(--secondary); border: 2px solid var(--gray-200); }
        .btn-danger { background: var(--danger); color: white; }

        .status-card {
            background: var(--white);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
            display: none;
            box-shadow: var(--shadow);
        }
        .status-card.active { display: block; }
        .status-icon { font-size: 3rem; margin-bottom: 0.5rem; }
        .status-text { font-weight: 600; color: var(--gray-700); margin-bottom: 1rem; }

        /* CHAT */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: var(--bg);
        }
        
        .chat-header {
            background: var(--white);
            padding: 1rem;
            border-bottom: 2px solid var(--gray-200);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .chat-avatar {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.3rem;
        }
        
        .chat-info { flex: 1; }
        .chat-name { font-weight: 700; font-size: 1rem; }
        .chat-status { font-size: 0.75rem; color: var(--primary); }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.9rem;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.sent {
            align-self: flex-end;
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 4px;
        }
        
        .message.received {
            align-self: flex-start;
            background: var(--white);
            box-shadow: var(--shadow);
            border-bottom-left-radius: 4px;
        }

        .chat-input-container {
            background: var(--white);
            padding: 1rem;
            border-top: 2px solid var(--gray-200);
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .chat-input {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid var(--gray-200);
            border-radius: 25px;
            font-size: 0.95rem;
            outline: none;
        }
        .chat-input:focus { border-color: var(--primary); }
        
        .chat-send {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: var(--primary);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        /* ADMIN */
        .requests-list { padding: 1rem; overflow-y: auto; flex: 1; }
        
        .request-card {
            background: var(--white);
            border-radius: 16px;
            padding: 1rem;
            margin-bottom: 1rem;
            border-left: 4px solid var(--primary);
            box-shadow: var(--shadow);
        }
        
        .request-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.8rem;
        }
        
        .request-title { font-weight: 700; }
        .request-info { font-size: 0.85rem; color: var(--gray-700); margin-bottom: 0.5rem; }
        
        .btn-small {
            flex: 1;
            padding: 0.6rem;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
        }

        /* MODALES */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .modal-overlay.active { display: flex; }
        
        .modal-container {
            background: var(--white);
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            overflow: hidden;
        }
        
        .modal-header {
            padding: 1.2rem;
            border-bottom: 2px solid var(--gray-200);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-title { font-size: 1.2rem; font-weight: 700; }
        .modal-close { background: none; border: none; font-size: 1.3rem; cursor: pointer; }
        .modal-body { padding: 1.2rem; }
        .modal-footer {
            padding: 1rem 1.2rem;
            border-top: 2px solid var(--gray-200);
            display: flex;
            gap: 10px;
        }
        .modal-footer .btn-primary { flex: 1; margin-top: 0; }

        .hidden { display: none !important; }
        .text-center { text-align: center; }
        .mb-2 { margin-bottom: 1rem; }

        /* Loading */
        .loading {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 3000;
        }
        .loading-spinner {
            width: 50px; height: 50px;
            border: 4px solid var(--gray-200);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 480px) {
            .logo-text { font-size: 1.1rem; }
            .message { max-width: 85%; }
        }
    </style>
</head>
<body>

    <div id="loadingScreen" class="loading">
        <div class="loading-spinner"></div>
        <p style="margin-top: 1rem; color: var(--gray-700); font-weight: 600;">Cargando...</p>
    </div>

    <header>
        <div class="logo">
            <div class="logo-icon"></div>
            <div class="logo-text">Uber<span>Pinar</span></div>
        </div>
        <button class="btn-icon" onclick="openRoleModal()">
            <i class="fa-solid fa-user"></i>
        </button>
    </header>

    <!-- Vista Pasajero -->
    <div id="viewPassenger" class="view">
        <div class="passenger-container">
            <div class="welcome-card">
                <h2>🌿 Transporte Ecológico</h2>
                <p>Viaja de forma sostenible</p>
            </div>
            
            <div class="input-group">
                <input type="text" class="input-field" id="pickupLocation" placeholder="📍 Punto de recogida (opcional)">
                <input type="text" class="input-field" id="dropoffLocation" placeholder="🏁 Destino (opcional)">
            </div>

            <div id="statusCard" class="status-card">
                <div class="status-icon" id="statusIcon">⏳</div>
                <div class="status-text" id="statusText">Esperando confirmación...</div>
                <button class="btn-primary btn-danger" onclick="cancelRide()">
                    <i class="fa-solid fa-xmark"></i> Cancelar
                </button>
            </div>

            <button id="btnRequest" class="btn-primary" onclick="requestRide()">
                <i class="fa-solid fa-bolt"></i> Solicitar Viaje
            </button>
            
            <button id="btnChat" class="btn-primary btn-secondary hidden" onclick="openChat()">
                <i class="fa-regular fa-comment-dots"></i> Abrir Chat
            </button>
        </div>
    </div>

    <!-- Vista Chat -->
    <div id="viewChat" class="view">
        <div class="chat-container">
            <div class="chat-header">
                <button class="btn-icon" onclick="goBack()">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <div class="chat-avatar">👨‍💼</div>
                <div class="chat-info">
                    <div class="chat-name">Admin UberPinar</div>
                    <div class="chat-status">En línea</div>
                </div>
            </div>
            
            <div class="chat-messages" id="chatMessages"></div>
            
            <div class="chat-input-container">
                <input type="text" class="chat-input" id="chatInput" placeholder="Escribe un mensaje..." onkeypress="handleChatEnter(event)">
                <button class="chat-send" onclick="sendChatMessage()">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Vista Admin -->
    <div id="viewAdmin" class="view">
        <div class="requests-list" id="adminRequests">
            <p class="text-center" style="color: var(--gray-500); padding: 2rem;">No hay solicitudes</p>
        </div>
    </div>

    <!-- Modal Rol -->
    <div id="roleModal" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <span class="modal-title">Selecciona tu Perfil</span>
                <button class="modal-close" onclick="closeModal('roleModal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <button class="btn-primary mb-2" onclick="selectRole('passenger')">
                    <i class="fa-solid fa-person-walking"></i> Soy Pasajero
                </button>
                <button class="btn-primary btn-secondary" onclick="openAdminLogin()">
                    <i class="fa-solid fa-shield-halved"></i> Soy Admin
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Admin -->
    <div id="adminLoginModal" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <span class="modal-title">Acceso Admin</span>
                <button class="modal-close" onclick="closeModal('adminLoginModal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <input type="password" id="adminCode" class="input-field" placeholder="Código de seguridad">
            </div>
            <div class="modal-footer">
                <button class="btn-primary btn-secondary" onclick="closeModal('adminLoginModal')">Cancelar</button>
                <button class="btn-primary" onclick="verifyAdmin()">Entrar</button>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_CODE = 'ADMIN2024';
        let currentRole = null;
        let currentRequestId = null;
        let currentChatId = null;
        let bc = null;

        // Inicialización
        window.onload = function() {
            setTimeout(() => {
                document.getElementById('loadingScreen').style.display = 'none';
                openRoleModal();
            }, 800);
            
            setupBroadcastChannel();
            setInterval(checkUpdates, 1000);
        };

        // Broadcast Channel (comunicación entre tabs)
        function setupBroadcastChannel() {
            if ('BroadcastChannel' in window) {
                bc = new BroadcastChannel('uberpinar');
                bc.onmessage = (e) => handleMessage(e.data);
            }
        }

        function broadcast(type, data) {
            const msg = { type, data, time: Date.now() };
            if (bc) bc.postMessage(msg);
            
            // Fallback localStorage
            const msgs = JSON.parse(localStorage.getItem('up_msgs') || '[]');
            msgs.push(msg);
            localStorage.setItem('up_msgs', JSON.stringify(msgs.slice(-100)));
        }

        function handleMessage(msg) {
            if (msg.type === 'request' && currentRole === 'admin') {
                renderAdminRequests();
            } else if (msg.type === 'chat' && msg.data.chatId === currentChatId) {
                addMessage(msg.data.text, msg.data.from === currentRole ? 'sent' : 'received');
            } else if (msg.type === 'accepted' && msg.data.id === currentRequestId) {
                onAccepted();
            } else if (msg.type === 'cancelled' && msg.data.id === currentRequestId) {
                resetUI();
            }
        }

        function checkUpdates() {
            if (currentRole === 'admin') renderAdminRequests();
        }

        // Roles
        function openRoleModal() {
            document.getElementById('roleModal').classList.add('active');
        }

        function selectRole(role) {
            currentRole = role;
            closeModal('roleModal');
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            
            if (role === 'passenger') {
                document.getElementById('viewPassenger').classList.add('active');
            } else {
                document.getElementById('viewAdmin').classList.add('active');
                renderAdminRequests();
            }
        }

        function openAdminLogin() {
            closeModal('roleModal');
            document.getElementById('adminLoginModal').classList.add('active');
        }

        function verifyAdmin() {
            if (document.getElementById('adminCode').value === ADMIN_CODE) {
                closeModal('adminLoginModal');
                selectRole('admin');
            } else {
                alert('Código incorrecto');
            }
        }

        // Pasajero
        function requestRide() {
            const pickup = document.getElementById('pickupLocation').value || 'No especificado';
            const dropoff = document.getElementById('dropoffLocation').value || 'No especificado';
            
            currentRequestId = 'ride_' + Date.now();
            currentChatId = currentRequestId;
            
            const req = { id: currentRequestId, pickup, dropoff, time: new Date().toLocaleString(), status: 'pending' };
            
            broadcast('request', req);
            
            const reqs = JSON.parse(localStorage.getItem('up_requests') || '[]');
            reqs.push(req);
            localStorage.setItem('up_requests', JSON.stringify(reqs));
            
            document.getElementById('statusCard').classList.add('active');
            document.getElementById('btnRequest').classList.add('hidden');
            
            setTimeout(() => {
                openChat();
                addMessage(`Solicité un viaje. Recogida: ${pickup}. Destino: ${dropoff}`, 'sent');
            }, 1500);
        }

        function cancelRide() {
            broadcast('cancelled', { id: currentRequestId });
            resetUI();
        }

        function onAccepted() {
            document.getElementById('statusIcon').textContent = '✅';
            document.getElementById('statusText').textContent = '¡Viaje Confirmado!';
            document.getElementById('btnChat').classList.remove('hidden');
        }

        function resetUI() {
            currentRequestId = null;
            currentChatId = null;
            document.getElementById('statusCard').classList.remove('active');
            document.getElementById('btnRequest').classList.remove('hidden');
            document.getElementById('btnChat').classList.add('hidden');
            document.getElementById('pickupLocation').value = '';
            document.getElementById('dropoffLocation').value = '';
        }

        // Admin
        function renderAdminRequests() {
            const container = document.getElementById('adminRequests');
            const reqs = JSON.parse(localStorage.getItem('up_requests') || '[]');
            const pending = reqs.filter(r => r.status === 'pending');
            
            if (pending.length === 0) {
                container.innerHTML = '<p class="text-center" style="color: var(--gray-500); padding: 2rem;">No hay solicitudes</p>';
                return;
            }
            
            container.innerHTML = '';
            pending.forEach(req => {
                const card = document.createElement('div');
                card.className = 'request-card';
                card.innerHTML = `
                    <div class="request-header">
                        <div class="request-title">🚖 Nuevo Viaje</div>
                        <div style="font-size:0.75rem;color:var(--gray-500)">${req.time}</div>
                    </div>
                    <div class="request-info">📍 ${req.pickup}</div>
                    <div class="request-info">🏁 ${req.dropoff}</div>
                    <button class="btn-small btn-primary" onclick="acceptRequest('${req.id}')">
                        <i class="fa-solid fa-check"></i> Aceptar
                    </button>
                    <button class="btn-small btn-danger" onclick="rejectRequest('${req.id}')" style="margin-top:5px">
                        <i class="fa-solid fa-xmark"></i> Rechazar
                    </button>
                `;
                container.appendChild(card);
            });
        }

        function acceptRequest(id) {
            currentChatId = id;
            broadcast('accepted', { id });
            
            const reqs = JSON.parse(localStorage.getItem('up_requests') || '[]');
            const req = reqs.find(r => r.id === id);
            if (req) {
                req.status = 'accepted';
                localStorage.setItem('up_requests', JSON.stringify(reqs));
            }
            
            openChat();
            addMessage('Hola, soy el admin. Tu viaje ha sido confirmado.', 'received');
            renderAdminRequests();
        }

        function rejectRequest(id) {
            broadcast('cancelled', { id });
            
            const reqs = JSON.parse(localStorage.getItem('up_requests') || '[]');
            const req = reqs.find(r => r.id === id);
            if (req) {
                req.status = 'rejected';
                localStorage.setItem('up_requests', JSON.stringify(reqs));
            }
            
            renderAdminRequests();
        }

        // Chat
        function openChat() {
            if (!currentChatId && currentRole === 'passenger') currentChatId = 'general';
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('viewChat').classList.add('active');
            loadChat();
        }

        function goBack() {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            if (currentRole === 'passenger') document.getElementById('viewPassenger').classList.add('active');
            else document.getElementById('viewAdmin').classList.add('active');
        }

        function handleChatEnter(e) {
            if (e.key === 'Enter') sendChatMessage();
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text || !currentChatId) return;
            
            const msg = { chatId: currentChatId, text, from: currentRole, time: new Date().toLocaleTimeString() };
            broadcast('chat', msg);
            
            const msgs = JSON.parse(localStorage.getItem('up_chat_' + currentChatId) || '[]');
            msgs.push(msg);
            localStorage.setItem('up_chat_' + currentChatId, JSON.stringify(msgs));
            
            addMessage(text, 'sent');
            input.value = '';
        }

        function addMessage(text, type) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.textContent = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function loadChat() {
            if (!currentChatId) return;
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';
            const msgs = JSON.parse(localStorage.getItem('up_chat_' + currentChatId) || '[]');
            msgs.forEach(m => addMessage(m.text, m.from === currentRole ? 'sent' : 'received'));
        }

        // Modales
        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        document.querySelectorAll('.modal-overlay').forEach(m => {
            m.addEventListener('click', function(e) {
                if (e.target === this) closeModal(this.id);
            });
        });
    </script>
</body>
</html>
